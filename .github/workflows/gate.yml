# Required check "gate": the human-approval rule without a GitHub App.
#   review:auto               → pass
#   review:human | regulated  → pass only when an approving review exists from someone other than the author
# Re-runs on label changes and on every review, so it flips green the moment the reviewer approves.
name: gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  statuses: write

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: pr.number });
            const tier = (labels.find(l => l.name.startsWith('review:')) || { name: 'review:pending' }).name.replace('review:', '');
            let state = 'pending', description = `tier ${tier}: waiting for classification`;
            if (tier === 'auto') { state = 'success'; description = 'auto-tier: no human review required'; }
            else if (tier === 'human' || tier === 'regulated') {
              const { data: reviews } = await github.rest.pulls.listReviews({ owner, repo, pull_number: pr.number });
              const latest = {};
              for (const r of reviews) if (r.user.login !== pr.user.login) latest[r.user.login] = r.state;
              const approved = Object.values(latest).includes('APPROVED');
              state = approved ? 'success' : 'failure';
              description = approved ? `${tier}-tier: approved by a reviewer` : `${tier}-tier: needs an approving review from a reviewer`;
            }
            await github.rest.repos.createCommitStatus({ owner, repo, sha: pr.head.sha, state, context: 'gate', description });
